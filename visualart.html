<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Art</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    /* LAYOUT */
    .container {
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      padding: 40px 20px;
      background: #f5f5f5;
    }

    .sidebar h2 {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      text-decoration: none;
      color: black;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .sidebar a:hover {
      text-decoration: underline;
    }

    /* MAIN */
    .main {
      margin-left: 220px;
      padding: 40px;
      width: calc(100% - 220px);
    }

    .main h1 {
      text-align: center;
      font-size: 32px;
      font-weight: normal;
      margin-top: 0;
      margin-bottom: 20px;
    }

    /* GRID */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .item {
      width: 100%;
      min-width: 0;
    }

    .item img {
      width: 100%;
      height: auto;
      display: block;
    }

    .caption {
      font-size: 14px;
      margin-top: 4px;
      text-align: center;
      color: #555;
    }

    /* TABLET */
    @media (max-width: 900px) {
      .main {
        padding: 30px;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .container {
        display: block;
      }

      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        padding: 25px 20px 15px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 18px;
      }

      .sidebar h2 {
        width: 100%;
        margin: 0 0 10px;
        font-size: 18px;
      }

      .sidebar a {
        display: inline-block;
        margin: 0;
        font-size: 13px;
      }

      .main {
        margin-left: 0;
        width: 100%;
        padding: 25px 20px 40px;
      }

      .main h1 {
        font-size: 26px;
        margin-bottom: 20px;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 5px;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Ethan David Bieg</h2>

    <a href="./index.html">Home</a>
    <a href="./about.html">About</a>
    <a href="./photography.html">Photography</a>
    <a href="./videography.html">Videography</a>
    <a href="./music.html">Music</a>
    <a href="./visualart.html">Visual Art</a>
    <a href="./poetry.html">Poetry</a>
    <a href="./contact.html">Contact</a>
  </div>

  <!-- MAIN -->
  <div class="main">

    <h1>Visual Art Projects</h1>

    <div class="gallery">

      <!-- IMAGE SLOTS -->

      <div class="item"><img src="visualart/1.jpg" alt="Visual art project 1"></div>
      <div class="item"><img src="visualart/2.jpg" alt="Visual art project 2"></div>
      <div class="item"><img src="visualart/3.jpg" alt="Visual art project 3"></div>

      <div class="item"><img src="visualart/4.jpg" alt="Visual art project 4"></div>
      <div class="item"><img src="visualart/5.jpg" alt="Visual art project 5"></div>
      <div class="item"><img src="visualart/6.jpg" alt="Visual art project 6"></div>

      <div class="item"><img src="visualart/7.jpg" alt="Visual art project 7"></div>
      <div class="item"><img src="visualart/8.jpg" alt="Visual art project 8"></div>
      <div class="item"><img src="visualart/9.jpg" alt="Visual art project 9"></div>

      <div class="item"><img src="visualart/10.jpg" alt="Visual art project 10"></div>
      <div class="item"><img src="visualart/11.jpg" alt="Visual art project 11"></div>
      <div class="item"><img src="visualart/12.jpg" alt="Visual art project 12"></div>

      <div class="item"><img src="visualart/13.jpg" alt="Visual art project 13"></div>
      <div class="item"><img src="visualart/14.jpg" alt="Visual art project 14"></div>

  </div>

</div>

</body>
</html>
