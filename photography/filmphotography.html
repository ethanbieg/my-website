<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moments on Film</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    /* LAYOUT */
    .container {
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      padding: 40px 20px;
      background: #f5f5f5;
    }

    .sidebar h2 {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      text-decoration: none;
      color: black;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .sidebar a:hover {
      text-decoration: underline;
    }

    /* MAIN */
    .main {
      margin-left: 220px;
      padding: 40px;
      width: calc(100% - 220px);
    }

    .main h1 {
      text-align: center;
      font-size: 32px;
      font-weight: normal;
      margin-top: 0;
      margin-bottom: 20px;
    }

    /* GALLERY */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* FULL WIDTH LANDSCAPE */
    .full {
      grid-column: span 3;
    }

    /* TABLET */
    @media (max-width: 900px) {
      .main {
        padding: 30px;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }

      .full {
        grid-column: span 2;
      }
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .container {
        display: block;
      }

      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        padding: 25px 20px 15px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 18px;
      }

      .sidebar h2 {
        width: 100%;
        margin: 0 0 10px;
        font-size: 18px;
      }

      .sidebar a {
        display: inline-block;
        margin: 0;
        font-size: 13px;
      }

      .main {
        margin-left: 0;
        width: 100%;
        padding: 25px 20px 40px;
      }

      .main h1 {
        font-size: 26px;
        margin-bottom: 20px;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .full {
        grid-column: span 1;
      }
    }
  </style>
</head>
