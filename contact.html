<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    /* LAYOUT */
    .container {
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      padding: 40px 20px;
      background: #f5f5f5;
    }

    .sidebar h2 {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      text-decoration: none;
      color: black;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .sidebar a:hover {
      text-decoration: underline;
    }

    /* MAIN CONTENT */
    .main {
      margin-left: 220px;
      padding: 40px;
      width: calc(100% - 220px);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* CONTACT SECTION */
    .contact-section {
      text-align: center;
      width: 100%;
    }

    /* CONTACT IMAGE */
    .contact-section img {
      width: 280px;
      height: 280px;
      max-width: 100%;
      object-fit: cover;
      display: block;
      margin: 0 auto 30px;
    }

    .contact-section h1 {
      font-size: 32px;
      font-weight: normal;
      margin-bottom: 35px;
    }

    /* CONTACT LINKS */
    .contact-links a {
      display: block;
      font-size: 16px;
      color: #555;
      text-decoration: none;
      margin-bottom: 18px;
      transition: color 0.2s ease;
    }

    .contact-links a:hover {
      color: black;
      text-decoration: underline;
    }

    /* TABLET */
    @media (max-width: 900px) {
      .main {
        padding: 30px;
      }

      .contact-section img {
        width: 250px;
        height: 250px;
      }
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .container {
        display: block;
      }

      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        padding: 25px 20px 15px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 18px;
      }

      .sidebar h2 {
        width: 100%;
        margin: 0 0 10px;
        font-size: 18px;
      }

      .sidebar a {
        display: inline-block;
        margin: 0;
        font-size: 13px;
      }

      .main {
        margin-left: 0;
        width: 100%;
        min-height: auto;
        padding: 35px 20px 40px;
      }

      .contact-section img {
        width: 220px;
        height: 220px;
        margin-bottom: 25px;
      }

      .contact-section h1 {
        font-size: 26px;
        margin-bottom: 30px;
      }

      .contact-links a {
        font-size: 15px;
        margin-bottom: 16px;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>My Work</h2>

    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="photography.html">Photography</a>
    <a href="videography.html">Videography</a>
    <a href="music.html">Music</a>
    <a href="visualart.html">Visual Art</a>
    <a href="poetry.html">Poetry</a>
    <a href="contact.html">Contact</a>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main">

    <div class="contact-section">

      <img src="contact/1.jpg" alt="Contact photo">

      <h1>Ways to contact me</h1>

      <div class="contact-links">
        <a href="mailto:ethanbieg7@gmail.com">Email</a>

        <a href="https://www.linkedin.com/in/ethan-bieg/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </div>

    </div>

  </div>

</div>

</body>
</html>
